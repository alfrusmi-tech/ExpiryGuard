spring.application.name=server
server.port=9090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expiryguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=framework

# Error messages are returned by ApiExceptionHandler
server.error.include-message=never

# Self-registered accounts need admin approval unless this is true
expiryguard.registration.auto-approve=${EXPIRYGUARD_AUTO_APPROVE:false}