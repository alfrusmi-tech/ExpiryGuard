services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: expiryguard
      POSTGRES_USER: expiryguard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"        # only for local dev (mvnw spring-boot:run)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expiryguard -d expiryguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    environment:
      PORT: 9090
      DB_URL: jdbc:postgresql://db:5432/expiryguard
      DB_USERNAME: expiryguard
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data: